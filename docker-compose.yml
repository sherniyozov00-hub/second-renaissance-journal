# The whole site: PostgreSQL + one app container (docs/deploy.md).
#   local:  docker compose up --build        (http://localhost:3000)
#   server: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# The server pulls the image GitHub Actions builds (APP_IMAGE); `--build`
# builds it locally instead. Works without a .env file (development defaults).

name: second-renaissance-journal

x-db-url: &db-url postgresql://${POSTGRES_USER:-journal}:${POSTGRES_PASSWORD:-journal}@postgres:5432/${POSTGRES_DB:-journal}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal}
      POSTGRES_DB: ${POSTGRES_DB:-journal}
    # Modest memory for a small server.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web app + background jobs (PDFs, notifications) in one process. On start
  # it applies migrations and seeds (idempotent).
  app:
    image: ${APP_IMAGE:-ghcr.io/sherniyozov00-hub/second-renaissance-journal:latest}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *db-url
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-The Second Renaissance of Uzbekistan}
      SEED_ON_START: ${SEED_ON_START:-true}
      # false on a real server: no demo accounts and sample articles.
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE-+998900000001}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-sandbox}
      # Development default only — set a real secret in .env for any deployment.
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-in-env-file}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_ESKIZ_EMAIL: ${SMS_ESKIZ_EMAIL:-}
      SMS_ESKIZ_PASSWORD: ${SMS_ESKIZ_PASSWORD:-}
      OTP_MOCK_CODE: ${OTP_MOCK_CODE:-}
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_SECRET_KEY: ${PAYME_SECRET_KEY:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODE: ${AI_MODE:-}
      SCHOLAR_MODE: ${SCHOLAR_MODE:-}
      # Optional S3-compatible bucket instead of the local files volume.
      # STORAGE_S3_ENDPOINT (not S3_ENDPOINT) so an old .env cannot switch it on.
      S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
    volumes:
      - files:/app/.data
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
  files:
