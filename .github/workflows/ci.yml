name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://journal:journal@localhost:5432/journal?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Schema matches migrations (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed
        run: npx prisma db seed
      - name: Seed is idempotent
        run: npx prisma db seed
      - name: Integration tests (search, auth, payments, workflow, AI)
        run: npm run test:integration
      - name: Xorazmiy AI eval (offline mock — platform rules)
        run: npm run ai:eval

  e2e:
    name: E2E (Playwright) and Lighthouse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://journal:journal@localhost:5432/journal?schema=public
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SMS_PROVIDER: mock
      OTP_MOCK_CODE: "123456"
      SEED_STAFF_PASSWORD: Demo-Admin-2026
      PAYMENTS_MODE: sandbox
      JOBS_MODE: inline
      APP_INTERNAL_URL: http://localhost:3000
      AI_MODE: mock
      SCHOLAR_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests (main flows, desktop + 360 px)
        run: npm run test:e2e
      - name: Lighthouse ≥ 90 (performance, accessibility, SEO)
        run: |
          npm run start -- -p 3000 > /tmp/server.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          LH_BASE_URL=http://localhost:3000 npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-and-lighthouse-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          retention-days: 7

  docker:
    name: Docker image (build, smoke test, publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sherniyozov00-hub/second-renaissance-journal
    steps:
      - uses: actions/checkout@v4
      - name: Production overrides are valid
        run: DOMAIN=example.uz docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Build the image
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
      - name: Image size
        run: docker image ls "$IMAGE"
      - name: Start the stack (migrations + seed run on start)
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/ | grep -q "The Third Renaissance"
          curl -fsS http://localhost:3000/ru | grep -q "The Third Renaissance"
      - name: Chromium prints a PDF inside the app container
        run: |
          docker compose exec -T app node -e "
            const { chromium } = require('playwright-core');
            (async () => {
              const b = await chromium.launch({ args: ['--no-sandbox'] });
              const p = await b.newPage();
              await p.goto('http://127.0.0.1:3000/');
              const pdf = await p.pdf({ format: 'A4' });
              await b.close();
              if (pdf.length < 1000) throw new Error('empty PDF');
              console.log('PDF bytes:', pdf.length);
            })().catch((e) => { console.error(e); process.exit(1); });"
      - name: Restart keeps data (migrations and seed are idempotent)
        run: |
          docker compose restart app
          docker compose up -d --no-build --wait --wait-timeout 120
          curl -fsS http://localhost:3000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
      - name: Publish to ghcr.io (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
