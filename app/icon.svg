<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="The Third Renaissance of Uzbekistan">
  <!-- Eight-pointed star: two 26px squares, the second rotated 45°, with a gold centre. -->
  <g fill="#1E3A8A">
    <rect x="7" y="7" width="26" height="26"/>
    <rect x="7" y="7" width="26" height="26" transform="rotate(45 20 20)"/>
  </g>
  <circle cx="20" cy="20" r="7.5" fill="#C99A2E"/>
</svg>
