# Production overrides (docs/deploy.md):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# - only Caddy is published (80/443); the database and the app stay internal;
# - Caddy gets a Let's Encrypt certificate for $DOMAIN;
# - no demo content is seeded.
# Requires Docker Compose 2.24+ (for !reset).

services:
  postgres:
    ports: !reset []
  app:
    ports: !reset []
    environment:
      SEED_DEMO: ${SEED_DEMO:-false}
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. journal.uz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
